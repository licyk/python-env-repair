name: Release

# Version changes on main, version tags and manual runs publish to PyPI after all checks pass.
# Tag-triggered runs also verify the tag matches python_env_repair/version.py.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['python_env_repair/version.py']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      # `--group` needs pip 25.1 or newer.
      - run: python -m pip install --upgrade pip
      - run: pip install -e . --group dev
      - name: Lint
        run: |
          python -m ruff check python_env_repair tests
          python -m ruff format --check python_env_repair tests
      - name: Tests
        run: python -B -m pytest -q
      # Static analysis for every supported OS; this does not replace native Windows/macOS runs.
      - name: Python types (ty)
        run: |
          for platform in linux win32 darwin; do
            python -m ty check --python "$(python -c 'import sys; print(sys.executable)')" \
              --python-version "${{ matrix.python }}" --python-platform "$platform" \
              --output-format github --no-progress python_env_repair tests
          done

  build:
    name: Build the distributions
    needs: [python]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install --upgrade build twine

      - name: The tag and python_env_repair/version.py agree
        id: version
        run: |
          version=$(python -c "import runpy; print(runpy.run_path('python_env_repair/version.py')['VERSION'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Package version: $version"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match VERSION $version in python_env_repair/version.py"
              exit 1
            fi
          fi

      - name: Build
        run: python -m build

      - name: The wheel carries the launcher stubs and licenses
        run: |
          python - <<'PY'
          import hashlib, pathlib, runpy, zipfile
          wheel = next(pathlib.Path("dist").glob("*.whl"))
          archive = zipfile.ZipFile(wheel)
          names = archive.namelist()
          pinned = runpy.run_path("python_env_repair/generator.py", run_name="check")["LAUNCHER_STUBS"]
          for stub, digest in pinned.items():
              data = archive.read(f"python_env_repair/_launchers/{stub}")
              assert hashlib.sha256(data).hexdigest() == digest, f"{stub} does not match its pinned hash"
          assert "python_env_repair/_launchers/LICENSE.txt" in names, "the wheel has no stub license"
          assert any(n.endswith(".dist-info/licenses/LICENSE") for n in names), "the wheel has no project license"
          print(wheel.name, f"{wheel.stat().st_size / 1e3:.0f} kB", len(names), "files")
          PY

      - name: Check the metadata
        run: twine check --strict dist/*

      - name: The wheel installs and runs without dependencies
        run: |
          python -m venv /tmp/probe
          /tmp/probe/bin/pip install --quiet --no-deps dist/*.whl
          cd /tmp
          /tmp/probe/bin/python -B -m python_env_repair --version
          /tmp/probe/bin/python -B -m python_env_repair verify --json --color never > /tmp/probe-report.json
          /tmp/probe/bin/python-env-repair --version

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # The environment can require an approval before a release.
    environment:
      name: pypi
      url: https://pypi.org/p/python-env-repair
    steps:
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - name: Install Twine
        run: python -m pip install --upgrade twine
      - uses: actions/download-artifact@v8.0.1
        with:
          name: distributions
          path: dist/
      - name: Publish
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TWINE_PASSWORD }}
        run: python -m twine upload dist/* --skip-existing --non-interactive

  github-release:
    name: GitHub release
    needs: [build, publish]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          name: distributions
          path: dist/
      - name: Create the release with the built files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
